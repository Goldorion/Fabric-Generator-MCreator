global_templates:
  - template: elementinits/entities.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameEntities.java"
  - template: elementinits/entityrenderers.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameEntityRenderers.java"

# Mixins
  - template: livingentity/monster_room_feature_mixin.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/mixin/MonsterRoomFeatureMixin.java"
    condition: "${w.getGElementsOfType('livingentity')?filter(e -> e.spawnInDungeons)?size != 0}"