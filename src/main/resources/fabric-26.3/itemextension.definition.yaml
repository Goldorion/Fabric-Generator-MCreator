global_templates:
  - template: elementinits/item_extensions.java.ftl
    writer: java
    condition: "${w.getGElementsOfType('itemextension')?filter(e -> (e.compostLayerChance gt 0) || e.enableFuel)?size != 0}"
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameItemExtensions.java"

templates:
  - template: itemextension/compostable_provider.json.ftl
    writer: json
    condition: "${data.compostLayerChance gt 0}"
    name: "@MODDATAROOT/context_int_provider/compostable/@registryname.json"
  - template: itemextension/fuel_provider.json.ftl
    writer: json
    condition: "${data.enableFuel}"
    name: "@MODDATAROOT/context_int_provider/fuel/@registryname.json"

  # Dispense behaviors are controlled by generator.yaml